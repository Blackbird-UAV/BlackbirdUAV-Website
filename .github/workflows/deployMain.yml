name: Deploy to Main
permissions:
  contents: read

on:
  workflow_run:
    workflows: ["Node.js CI Main"]
    types:
      - completed
    branches: ["main"]

# One deploy at a time, never cancelled mid-upload (that would leave a
# half-synced site). queue: max keeps every waiting run; by default a newly
# queued run cancels the one already waiting, even one for a newer commit.
concurrency:
  group: deploy-production
  cancel-in-progress: false
  queue: max

jobs:
  # npm ci and next build run code from hundreds of npm packages, and any one
  # of them could be compromised. So this job gets no environment and no
  # secrets: it builds the export and hands it to the deploy job as an
  # artifact. The FTP credentials only reach the deploy job, which runs no npm
  # code.
  build:
    runs-on: ubuntu-latest
    # Deploys queue behind each other, so a hung one mustn't hold the queue
    # for the 6-hour default. Real deploys take one to two minutes.
    timeout-minutes: 30
    # Only a push to main, or a manual run of CI on main (which takes write
    # access), whose CI passed. The event check also stops fork PRs from a
    # branch named main, which the branches filter lets through.
    if: ${{ github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') }}
    outputs:
      deploy: ${{ steps.guard.outputs.deploy }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The commit CI validated (the default is main's tip at trigger time).
          ref: ${{ github.event.workflow_run.head_sha }}

      # Runs can finish out of order, and re-running an old CI run triggers
      # one too: deploy only main's current tip, so a stale run can't roll
      # the site back. Skipping isn't a failure; the tip's own run deploys it.
      - name: Skip unless this is still the tip of main
        id: guard
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(git ls-remote origin refs/heads/main | awk '$2 == "refs/heads/main" { print $1 }')
          if [ -z "$tip" ]; then
            echo "::error::Could not read the tip of main"
            exit 1
          fi
          if [ "$tip" = "$HEAD_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::This run is for $HEAD_SHA, but main is now at $tip; that commit's own CI run deploys it if it passes."
          fi

      - name: Use Node.js 24.x
        if: steps.guard.outputs.deploy == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: './website/package-lock.json'

      - name: Cache Next.js build
        if: steps.guard.outputs.deploy == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ./website/.next/cache
          key: nextjs-${{ runner.os }}-24.x-${{ hashFiles('./website/package-lock.json') }}-${{ hashFiles('./website/src/**/*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-24.x-${{ hashFiles('./website/package-lock.json') }}-
            nextjs-${{ runner.os }}-24.x-

      - name: Install Dependencies and Build
        if: steps.guard.outputs.deploy == 'true'
        run: |
          npm ci
          npm run prod
        working-directory: ./website

      # This action can't upload an empty file over FTPS (upstream #412, #516,
      # #520), so one would fail this deploy and every later one. Paths the
      # action excludes by default (.git*, node_modules) are left out.
      - name: Refuse 0-byte files
        if: steps.guard.outputs.deploy == 'true'
        run: |
          empty=$(find ./website/out -type f -empty ! -path '*/.git*' ! -path '*/node_modules/*')
          if [ -n "$empty" ]; then
            list=${empty//'%'/%25}
            echo "::error title=FTPS can't upload 0-byte files::Add content to these files or remove them (SamKirkland/FTP-Deploy-Action#412, #516, #520):%0A${list//$'\n'/%0A}"
            exit 1
          fi

      # upload-artifact leaves out dotfiles unless include-hidden-files is set,
      # and the export's .htaccess is one. The export is public anyway, so a
      # day's retention is only for re-running the deploy job.
      - name: Upload the export
        if: steps.guard.outputs.deploy == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: ./website/out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    # The build job's guard decides: false when the run is stale.
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # The FTP secrets live in this environment, which only main may deploy to,
    # so a workflow on any other branch can't read them.
    environment: production
    # Deploys queue behind each other, so a hung one mustn't hold the queue
    # for the 6-hour default. Real deploys take one to two minutes.
    timeout-minutes: 30

    steps:
      # The build job checked this too, but this job can be re-run on its own
      # ("Re-run failed jobs"), even after a newer commit has deployed, so check
      # again just before uploading. Same outcome as the build job's guard.
      - name: Skip unless this is still the tip of main
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ -z "$tip" ]; then
            echo "::error::Could not read the tip of main"
            exit 1
          fi
          if [ "$tip" = "$HEAD_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::This run is for $HEAD_SHA, but main is now at $tip; that commit's own CI run deploys it if it passes."
          fi

      - name: Download the export
        if: steps.guard.outputs.deploy == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ./out

      # The sync below deletes from the server whatever isn't in ./out. A
      # missing .htaccess would take away the clean URLs, the HTTPS redirect
      # and the dotfile 403, and a missing index.html means the export landed
      # somewhere else.
      - name: Check the export is complete
        if: steps.guard.outputs.deploy == 'true'
        shell: bash
        run: |
          for f in index.html 404.html .htaccess; do
            if [ ! -s "./out/$f" ]; then
              echo "::error title=Incomplete export::out/$f is missing or empty, so nothing was deployed."
              exit 1
            fi
          done

      - name: Upload to FTP
        if: steps.guard.outputs.deploy == 'true'
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: dev.blackbirduav.ca
          port: 21
          # FTPS encrypts the login and files. "loose" skips certificate checks
          # (stops sniffing, not an active MITM): as of 2026-10-08 the host
          # presents a cert for srv16.swhc.ca (another IP), not for the server
          # name above. Use "strict" if it ever presents one for that name.
          protocol: ftps
          security: loose
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /
