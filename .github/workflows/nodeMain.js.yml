name: Node.js CI Main
permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Run by hand on main when GitHub drops the push event for a merge (it did
  # on 2026-10-22, and nothing ran): Deploy to Main follows this run as it
  # would a push's.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: "./website/package-lock.json"

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: |
            ./website/.next/cache
          key: nextjs-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('./website/package-lock.json') }}-${{ hashFiles('./website/src/**/*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('./website/package-lock.json') }}-
            nextjs-${{ runner.os }}-${{ matrix.node-version }}-

      - name: Install dependencies
        run: npm ci
        working-directory: ./website

      - name: Audit dependencies
        # npm audit --audit-level=high, twice: production dependencies with no
        # allowlist, then the whole tree minus website/scripts/audit.mjs's
        # allowlist, which can therefore only ever excuse dev-only advisories.
        run: npm run audit:ci
        working-directory: ./website

      - name: Run linting
        run: npm run lint
        working-directory: ./website

      - name: Run build
        run: npm run build --if-present
        working-directory: ./website

      # public/sitemap.xml is written by hand, so fail when it and the export
      # disagree, e.g. a new team season whose page isn't listed yet.
      - name: Check sitemap.xml lists every page
        run: npm run check:sitemap
        working-directory: ./website
