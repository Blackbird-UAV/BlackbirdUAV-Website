name: Deploy to Main
permissions:
  contents: read

on:
  workflow_run:
    workflows: ["Node.js CI Main"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: './website/package-lock.json'

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: |
            ./website/.next/cache
          key: nextjs-${{ runner.os }}-24.x-${{ hashFiles('./website/package-lock.json') }}-${{ hashFiles('./website/src/**/*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-24.x-${{ hashFiles('./website/package-lock.json') }}-
            nextjs-${{ runner.os }}-24.x-

      - name: Install Dependencies and Build
        run: |
          npm ci
          npm run prod
        working-directory: ./website

      - name: Upload to FTP
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: dev.blackbirduav.ca
          port: 21
          # FTPS encrypts the login and files. "loose" skips certificate checks
          # (stops sniffing, not an active MITM): as of 2026-10-08 the host
          # presents a cert for srv16.swhc.ca (another IP), not for the server
          # name above. Use "strict" if it ever presents one for that name.
          protocol: ftps
          security: loose
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./website/out/
          server-dir: /