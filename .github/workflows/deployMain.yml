name: Deploy to Main
permissions:
  contents: read

on:
  workflow_run:
    workflows: ["Node.js CI Main"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: './website/package-lock.json'

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ./website/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('./website/package-lock.json') }}-${{ hashFiles('./website/src/**/*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('./website/package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Install Dependencies and Build
        run: |
          npm install --no-warnings
          npm run build
        working-directory: ./website
        env:
          npm_config_loglevel: error

      - name: Upload to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: dev.blackbirduav.ca
          port: 21
          protocol: ftp
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./website/out/
          server-dir: /