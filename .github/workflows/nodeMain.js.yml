name: Node.js CI Main
permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: "./website/package-lock.json"

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: |
            ./website/.next/cache
          key: nextjs-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('./website/package-lock.json') }}-${{ hashFiles('./website/src/**/*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('./website/package-lock.json') }}-
            nextjs-${{ runner.os }}-${{ matrix.node-version }}-

      - name: Install dependencies
        run: npm ci
        working-directory: ./website

      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: ./website

      - name: Run linting
        run: npm run lint
        working-directory: ./website

      - name: Run build
        run: npm run build --if-present
        working-directory: ./website
