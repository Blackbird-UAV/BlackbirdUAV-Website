# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/website/" # Location of package manifests
    schedule:
      interval: "weekly"
    # One PR per set of packages that move together. Separate PRs for react
    # or @mantine/* packages each fail CI (#278, #286, #287, #288).
    groups:
      react: # react-dom 19 refuses to load unless react is the identical version
        patterns: ["react", "react-dom", "@types/react"]
      mantine: # the @mantine packages pin each other to the exact same release
        patterns: ["@mantine/*"]
      next: # released together
        patterns: ["next", "@next/*", "eslint-config-next"]
  - package-ecosystem: "github-actions" # Actions used in .github/workflows, incl. SHA pins
    directory: "/" # Dependabot reads .github/workflows from the repository root
    schedule:
      interval: "weekly"
